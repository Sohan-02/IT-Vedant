<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: black;
        }
        
        .banner img{
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .title-text{
            color: white;

        .movies img {

        }

        .movies{

            width: 500px;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
        }

        
    </style>
</head>
