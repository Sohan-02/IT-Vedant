    <!-- target attribute specifies where to open the link document 
       _blank , _self , _parent , _top -->

    <a href="https://www.wikipedia.org/"  target="myframe">Wikipedia</a>

  

    <iframe src="" frameborder="0" name="myframe" width="400px" height="500px"></iframe>


    <!-- the target attribute is used to specify where to open the link document
    
    _self(Default) : opens the link in the same frame/tab where it was clicked

    _blank:Opens the link in a new tab

    _parent:Open te link in the parent frame of the current frame

    _top:Opens the link in the full body of the window, cancelling all frames

    frame name : open the link document in the named iframe
    -->
