<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Css selector targets the HTML tag to be style -->

    <!-- priority order 
     universal selector(*) -> lowest
     Element selector(h1,p1)
     class selector(.class)
     ID selector(#id)
     inline css (style="") -> Heightest
     
     -->

    <p>Hello</p>
    <div>This is css lecture</div>
    <p id="mypara">this is paragraph </p>
    <h1>welcome to website </h1>
    <p>demo</p>

    <p class="paraclass" id="idselector2">This is class selector</p>
    <p class="para2class paraclass">this is class 2</p>
    <!-- class selector (.) Applies style to element with specific class-->
</body>
</html>
