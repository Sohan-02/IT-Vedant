<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Audio</h1>

    <!-- First way -->
    <audio src="file_example_MP3_1MG.mp3" controls></audio>
    
    <br>
    <br>
    <!-- Second way -->
    <audio controls autoplay loop muted >
        <!-- auto play , makes audio play automatically when site is open -->

        <!-- loop , makes audio play in loop-->

        <!-- muted, makes audio mute initally -->
        <source src="file_example_MP3_1MG.mp3">
    </audio>


</body>
</html>
