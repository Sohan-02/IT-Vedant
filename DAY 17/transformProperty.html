<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            margin-top: 90px;
            margin-left: 100px;
            width: 200px; 

            /* to make transition snooth use transition */
            transition: 0.5s ;
            
           
        }


        /* translate

        moves the element horizontally and vertically from its current position. It takes two values, the first value is for horizontal movement and the second value is for vertical 

        transform:translate (right , down);

        */

        /* img:hover {
            transform: translate(40px, 40px);
           
        } */



        /* rotate 
        the rotate function is a css trandform function used to rotate an element around its center by a specified angle
        
        it changes the orientation of the element 
        
        transform:rotate(angle);

        + clockwise , - anticlockwise

        */
        /* img:hover{
            transform:rotate(60deg);
        } */



        /* scale is used to change the size of an element 
        Default is single
         transform:scale(1.2);

         for both horizontal and vertical scaling we can use two values
         transform:scale(x,y);
        */
        
        /* img:hover{
            transform:scale(1.2);
        } */


        /* Skew is used to skew an element along the X and Y axes */
        /* img:hover{
            transform:skew(20deg, 10deg);
            
            default is single value for horizontal skewing  


        } */

        img:hover{
            transform:skew(20deg);}
        </style>
</head>
<body>
    
    <!-- transform property
     
    the transform property in css is used to change the position -->
    <img src="images/image1.png" alt="" >
</body>
</html>
