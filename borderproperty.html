<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #para1{
            /* border: 1px solid rgb(0, 17, 255); */
            border-bottom: 1px solid red;
            padding: 10px;
            border-radius: 5px;
        }

    #para2{
        border-bottom: 1px dotted rgb(255, 217, 0);
            padding: 10px;
            border-radius: 5px;
    }
    #para3{
        border-bottom: 1px dashed rgb(175, 206, 0);
            padding: 10px;
            border-radius: 5px;
    }
    #para4{
        border-bottom: 4px groove rgb(212, 0, 255);
            padding: 10px;
            border-radius: 5px;
    }
    
    #para5{
        border-bottom: 4px solid rgb(212, 0, 255);
        border-right: 4px groove rgb(201, 2, 2);
        border-left: 4px groove rgb(245, 229, 6);
        border-top: 4px groove rgb(45, 10, 202);
            padding: 10px;
            border-radius: 5px;
    }


    </style>
</head>
<body>
    <p id="para1">
        I have border on all sides.
    </p>

    <p id="para2">this is para 2</p>
    <p id="para3">this is para 3</p>
    <p id="para4">this is para 4</p>
    <p id="para5">this is para 5</p>

</body>
</html>
