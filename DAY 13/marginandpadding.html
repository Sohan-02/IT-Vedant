<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: aqua;
            border: 2px solid;
            padding: 20px;
            margin: 20px;
        }

        .box2{
            background-color: rebeccapurple;
            border: 2px solid;
            padding-top: 20px;
            padding-left: 40px;
            padding-bottom: 5px;
            margin-left: 50px;
        }

    </style>
</head>
<body>
    
    <!-- padding adds space inside an element between its content and border -->

    <!-- margin adds space outside an element creating gaps betwrrm elements -->

    <div class="box1">
        box1
    </div>

    <div class="box2">
        box2
    </div>
</body>
</html>
