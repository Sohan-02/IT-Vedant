<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: aqua;
            margin: 10px;
            text-align: center;
            
            display: inline-block;

        }

        .static-box{
            position: static;
            top: 20px;
        }

        .relative-box{
            position: relative;
            top: 20px;
            left: 50px;
        }

        .absolute-box{
            position: absolute;
            top: 70px;
            left: 50px;

        }
    </style>
</head>
<body>
    <!-- static position -->
    <div class="box static-box">one</div>

    <!-- relative position 
     
    the element is positioned relative to its original position using top,left,rightorbottom-->
    <div class="box absolute-box">two</div>

    <!-- absolute position 
     
    The element is removed from the normal document flow and positioned relative to its nearist position paent element -->
    <div class="box  ">three</div>
</body>
</html>
